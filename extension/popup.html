<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KVS Copilot Autofill</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f8f9fa;
      color: #212529;
    }
    .container {
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #dee2e6;
    }
    .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #1e3a5f 0%, #2c5282 100%);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 14px;
    }
    .title {
      font-size: 16px;
      font-weight: 600;
      color: #1e3a5f;
    }
    .status-section {
      margin-bottom: 16px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      font-size: 14px;
    }
    .status-label {
      color: #6c757d;
      font-weight: 500;
    }
    .status-value {
      font-weight: 600;
    }
    .status-value.active {
      color: #28a745;
    }
    .status-value.inactive {
      color: #dc3545;
    }
    .target-section {
      margin-bottom: 16px;
      padding: 12px;
      background: white;
      border-radius: 6px;
      border: 1px solid #dee2e6;
    }
    .target-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #6c757d;
      margin-bottom: 4px;
    }
    .target-value {
      font-size: 13px;
      color: #495057;
      word-break: break-all;
    }
    .class-section {
      margin-bottom: 16px;
      padding: 12px;
      background: white;
      border-radius: 6px;
      border: 1px solid #dee2e6;
    }
    .class-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #6c757d;
      margin-bottom: 4px;
    }
    .class-value {
      font-size: 14px;
      font-weight: 600;
      color: #1e3a5f;
    }
    .class-value.empty {
      color: #adb5bd;
      font-style: italic;
    }
    .footer {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #dee2e6;
      text-align: center;
      font-size: 11px;
      color: #adb5bd;
    }
    .version {
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">KV</div>
      <div class="title">KVS Copilot Autofill</div>
    </div>

    <div class="status-section">
      <div class="status-row">
        <span class="status-label">Status</span>
        <span class="status-value active" id="status-value">Active</span>
      </div>
      <div class="status-row">
        <span class="status-label">Target</span>
        <span class="status-value" id="target-value">KVS Demo Admin Statistics</span>
      </div>
    </div>

    <div class="class-section">
      <div class="class-label">Current Detected Class</div>
      <div class="class-value empty" id="class-value">Not detected</div>
    </div>

    <div class="footer">
      <div class="version">v1.0.0</div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
